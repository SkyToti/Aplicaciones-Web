<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Cuaderno de repaso</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<!-- Autocontenida a propósito: GitHub Pages sirve esta página en CUALQUIER
     ruta que no exista, incluso en subcarpetas, donde styles.css ya no se
     encontraría con una ruta relativa. -->
<style>
  :root{--paper:#f7f1e3;--card:#fffdf6;--ink:#1a1712;--ink2:#5d564a}
  @media (prefers-color-scheme:dark){:root{--paper:#1b1a21;--card:#26252e;--ink:#f3efe5;--ink2:#b9b2a4}}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Nunito",-apple-system,sans-serif;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(rgba(128,120,100,.16) 1.4px,transparent 1.4px);background-size:22px 22px;
  }
  .card{
    max-width:520px;background:var(--card);border:2.5px solid var(--ink);border-radius:20px;
    box-shadow:6px 6px 0 var(--ink);padding:34px 28px 28px;text-align:center;position:relative;
  }
  .tape{position:absolute;top:-13px;left:50%;width:110px;height:26px;margin-left:-55px;background:#f7c33f;border:2px solid #1a1712;transform:rotate(-3deg)}
  .code{
    display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:3.6rem;line-height:1;
    background:#fff1c9;color:#1a1712;border:2.5px solid #1a1712;border-radius:14px;padding:10px 20px;margin-bottom:16px;
    box-shadow:4px 4px 0 #1a1712;
  }
  h1{font-family:"Fredoka",sans-serif;font-size:1.8rem;margin:0 0 8px}
  p{color:var(--ink2);line-height:1.6;margin:0 0 12px}
  .nota{
    text-align:left;background:#fff1c9;color:#1a1712;border:2px solid #1a1712;border-radius:12px;
    padding:12px 14px;margin:18px 0 22px;font-size:.95rem;line-height:1.55;
  }
  a.btn{
    display:inline-block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1rem;text-decoration:none;
    color:#1a1712;background:#f7c33f;border:2.5px solid #1a1712;border-radius:12px;padding:12px 22px;
    box-shadow:4px 4px 0 #1a1712;
  }
  a.btn:active{transform:translate(4px,4px);box-shadow:none}
</style>
</head>
<body>
  <main class="card">
    <span class="tape"></span>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>La dirección está mal escrita, o la página se movió.</p>
    <div class="nota">
      <b>Ya que estás aquí, repasa:</b> esto es un <b>404 Not Found</b>, de la familia <b>4xx</b>.
      O sea que la culpa es <b>del cliente</b>, que pidió una ruta que no está — no del servidor.
    </div>
    <a class="btn" id="volver" href="./">Volver al inicio</a>
  </main>
  <script>
    // en GitHub Pages el sitio vive en /Aplicaciones-Web/; en local, en la raíz
    var base = location.pathname.indexOf('/Aplicaciones-Web/') === 0 ? '/Aplicaciones-Web/' : '/';
    document.getElementById('volver').href = base;
  </script>
</body>
</html>
